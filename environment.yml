# Combined conda environment for the whole project:
#   - theory/                (theorem1_theorem2.py, theorem3.py, debruijn_dag_figure.py)
#   - synthetic_experiment/  (generate_data.py, model.py, train_eval.py, run_experiments.py)
#   - benchmarks/            (entropy_exp.py)
#
# theory needs numpy / scipy / matplotlib / networkx / numba; the synthetic
# experiment additionally needs torch and einx. torch and einx are installed
# via pip so the platform-appropriate build is selected automatically -- CUDA
# on the Linux cluster (the 2x4090 run), MPS on Apple Silicon.
#
# The benchmarks entropy experiment (entropy_exp.py) teacher-forces Qwen with
# Hugging Face transformers and needs datasets / transformers.
#
# Create with:  conda env create -f environment.yml
# Update with:  conda env update -f environment.yml --prune
#
# Tested (Apple Silicon / arm64) with: python 3.12.3, torch 2.13.0, numpy 2.4.6,
# scipy 1.18.0, matplotlib 3.11.1, networkx 3.6.1, numba 0.66.0, einx 0.4.3.
name: ngram-experiments
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.0
  - scipy>=1.11
  - matplotlib>=3.8
  - networkx>=3.0
  - numba>=0.60          # provides numpy>=2 compatibility; conda resolves a matching numpy
  - tqdm>=4.60           # progress bars for run_experiments.py
  - pip>=23
  - pip:
      # torch: MPS build on macOS. On a Linux CUDA box, install a wheel that
      # matches the *driver*, not just any latest wheel -- PyPI's default torch
      # (>=2.13) is a CUDA-13 build and needs a newer driver. For a CUDA 12.x
      # driver (e.g. 12.6) install from the matching cu12 index, e.g.:
      #   pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cu126
      # Also install other packages with `--no-deps` (or pin torch) so pip does
      # not silently upgrade torch to an incompatible CUDA build.
      - torch>=2.2
      - einx>=0.4          # not packaged on conda-forge, so installed via pip
      # benchmarks/entropy_exp.py:
      - transformers>=4.56 # >=4.51 for Qwen3; >=4.56 for `dtype=` (torch_dtype deprecated)
      - datasets>=2.19     # loads the reasoning benchmarks / WikiText from the Hub
      - accelerate>=0.26   # required for device_map="auto" multi-GPU model sharding
      # math/ (equation-solving experiment): LoRA fine-tunes of
      # Qwen2.5-1.5B-Instruct, one per state-emission interval k. A full
      # fine-tune needs ~25 GB for weights+grads+AdamW state and will not fit a
      # 24 GB 4090, so peft/LoRA is required rather than optional.
      - peft>=0.11         # LoRA adapters (math/train_eval.py)
      - sympy>=1.12        # equation generation / factoring (math/generate_data.py)
